<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Centre - Connektly</title>
  <meta name="description" content="Find Connektly setup guides, product tutorials, billing help, and support answers." />
  <link rel="icon" href="../connektly-favicon.png" />
  <link rel="stylesheet" href="./help.css" />
</head>
<body>
  <div data-site-header></div>
  <main class="help-main">
    <section class="help-hero">
      <div class="help-shell">
        <span class="help-eyebrow">Connektly Help Centre</span>
        <h1>How can we help you?</h1>
        <p>Find setup guides, product tutorials, messaging best practices, billing help, and answers to common questions.</p>
        <div class="help-search">
          <input data-help-search type="search" placeholder="Search for articles, guides, or questions..." autocomplete="off" />
          <span class="help-search__icon" aria-hidden="true"></span>
          <div class="help-search-results" data-search-results></div>
        </div>
      </div>
    </section>
    <section class="help-section">
      <div class="help-shell">
        <div class="help-section__head">
          <div>
            <h2>Browse collections</h2>
            <p>Choose a topic and explore the articles inside.</p>
          </div>
        </div>
        <div class="collection-grid" data-collections-grid>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="../components/global.js"></script>
  <script src="./help.js"></script>
</body>
</html>
