<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connektly Lead Admin</title>
  <link rel="icon" href="../connektly-favicon.png" />
  <style>
    :root {
      --bg: #f6f8fc;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #64748b;
      --line: #dfe7f3;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --good: #047857;
      --warn: #b45309;
      --bad: #b91c1c;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .brand img {
      width: 34px;
      height: 34px;
    }

    .brand strong {
      font-size: 1.2rem;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.8rem;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
    }

    .field {
      display: grid;
      gap: 7px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
    }

    input,
    select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff;
      background: var(--brand);
      font-weight: 800;
    }

    .button:hover {
      background: var(--brand-dark);
    }

    .button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .button--ghost {
      color: var(--ink);
      background: #eef4ff;
    }

    .button--ghost:hover {
      background: #dbeafe;
    }

    .error {
      min-height: 20px;
      color: var(--bad);
      font-weight: 700;
    }

    .app {
      min-height: 100vh;
      display: none;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .content {
      width: min(1360px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric,
    .filters,
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .metric {
      padding: 18px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 2rem;
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr repeat(4, 1fr) auto;
      gap: 12px;
      padding: 14px;
      margin-bottom: 18px;
      align-items: end;
    }

    .filters .field {
      margin: 0;
    }

    .table-wrap {
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 0.92rem;
    }

    th {
      color: #475569;
      background: #f8fbff;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .status {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #1e293b;
      background: #e2e8f0;
      text-transform: capitalize;
    }

    .status--new {
      color: var(--brand-dark);
      background: #dbeafe;
    }

    .status--contacted,
    .status--qualified {
      color: var(--warn);
      background: #fef3c7;
    }

    .status--converted {
      color: var(--good);
      background: #dcfce7;
    }

    .status--rejected {
      color: var(--bad);
      background: #fee2e2;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .small-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 34px;
      padding: 7px 10px;
      color: var(--brand-dark);
      background: #fff;
      font-weight: 800;
    }

    .empty {
      padding: 36px;
      text-align: center;
      color: var(--muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: rgba(15, 23, 42, 0.52);
    }

    .modal.is-open {
      display: block;
    }

    .drawer {
      width: min(620px, 100%);
      height: 100%;
      margin-left: auto;
      overflow: auto;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .drawer__head {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 22px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .drawer__body {
      padding: 22px;
    }

    .detail-section {
      margin-bottom: 24px;
    }

    .detail-section h2 {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .details {
      display: grid;
      grid-template-columns: 170px 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .details dt,
    .details dd {
      margin: 0;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
    }

    .details dt {
      background: #f8fbff;
      color: #475569;
      font-weight: 800;
    }

    .details dd {
      overflow-wrap: anywhere;
    }

    .details dt:last-of-type,
    .details dd:last-of-type {
      border-bottom: 0;
    }

    @media (max-width: 1000px) {
      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .topbar,
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .metrics,
      .filters {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .details dt {
        border-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell" id="login-screen">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">
        <img src="../logo.svg" alt="Connektly" />
        <strong>Connektly</strong>
      </div>
      <h1 id="login-title">Lead Admin</h1>
      <p class="muted">Sign in to view website form submissions.</p>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="button" type="submit" id="login-button">Login</button>
        <p class="error" id="login-error" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <main class="app" id="admin-app">
    <header class="topbar">
      <div class="brand">
        <img src="../logo.svg" alt="Connektly" />
        <div>
          <strong>Lead Dashboard</strong>
          <div class="muted">Website submissions and attribution</div>
        </div>
      </div>
      <button class="button button--ghost" type="button" id="logout-button">Logout</button>
    </header>

    <div class="content">
      <section class="metrics" aria-label="Lead summary">
        <article class="metric"><span>Total leads</span><strong id="total-count">0</strong></article>
        <article class="metric"><span>New</span><strong id="new-count">0</strong></article>
        <article class="metric"><span>Contacted</span><strong id="contacted-count">0</strong></article>
        <article class="metric"><span>Converted</span><strong id="converted-count">0</strong></article>
      </section>

      <form class="filters" id="filters-form">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" name="search" type="search" placeholder="Name, email, phone, company" />
        </div>
        <div class="field">
          <label for="formType">Lead Type</label>
          <select id="formType" name="formType">
            <option value="">All types</option>
            <option value="homepage_lead">Homepage</option>
            <option value="landing_page_lead">Landing Page</option>
            <option value="contact_us">Contact Us</option>
            <option value="book_demo">Book Demo</option>
            <option value="partner_application">Partner</option>
            <option value="pricing_enquiry">Pricing</option>
            <option value="footer_lead">Footer</option>
            <option value="popup_lead">Popup</option>
            <option value="generic_lead">Generic</option>
          </select>
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="">All statuses</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="qualified">Qualified</option>
            <option value="converted">Converted</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="field">
          <label for="utmSource">UTM Source</label>
          <input id="utmSource" name="utmSource" type="text" />
        </div>
        <div class="field">
          <label for="utmCampaign">UTM Campaign</label>
          <input id="utmCampaign" name="utmCampaign" type="text" />
        </div>
        <div class="field">
          <label for="sourcePage">Source Page</label>
          <input id="sourcePage" name="sourcePage" type="text" />
        </div>
        <button class="button" type="submit">Apply</button>
      </form>

      <section class="table-wrap" aria-live="polite">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Lead Type</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Company</th>
              <th>Source Page</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="lead-rows"></tbody>
        </table>
        <div class="empty" id="empty-state" hidden>No leads found.</div>
      </section>
    </div>
  </main>

  <section class="modal" id="detail-modal" aria-modal="true" role="dialog" aria-labelledby="detail-title">
    <aside class="drawer">
      <header class="drawer__head">
        <div>
          <h1 id="detail-title">Lead Details</h1>
          <p class="muted" id="detail-subtitle"></p>
        </div>
        <button class="button button--ghost" type="button" id="close-modal">Close</button>
      </header>
      <div class="drawer__body" id="detail-body"></div>
    </aside>
  </section>

  <script>
    const API_BASE_URL = "https://api.connektly.in";
    const TOKEN_KEY = "connektly_admin_token";

    const loginScreen = document.getElementById("login-screen");
    const adminApp = document.getElementById("admin-app");
    const loginForm = document.getElementById("login-form");
    const loginButton = document.getElementById("login-button");
    const loginError = document.getElementById("login-error");
    const logoutButton = document.getElementById("logout-button");
    const filtersForm = document.getElementById("filters-form");
    const leadRows = document.getElementById("lead-rows");
    const emptyState = document.getElementById("empty-state");
    const modal = document.getElementById("detail-modal");
    const detailBody = document.getElementById("detail-body");
    const detailSubtitle = document.getElementById("detail-subtitle");
    const closeModal = document.getElementById("close-modal");

    let leads = [];

    const labels = {
      homepage_lead: "Homepage Lead",
      landing_page_lead: "Landing Page Lead",
      contact_us: "Contact Us",
      book_demo: "Book Demo",
      partner_application: "Partner Application",
      pricing_enquiry: "Pricing Enquiry",
      footer_lead: "Footer Lead",
      popup_lead: "Popup Lead",
      generic_lead: "Generic Lead"
    };

    function token() {
      return window.localStorage.getItem(TOKEN_KEY) || "";
    }

    function setToken(value) {
      if (value) {
        window.localStorage.setItem(TOKEN_KEY, value);
      } else {
        window.localStorage.removeItem(TOKEN_KEY);
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("en-IN", {
        dateStyle: "medium",
        timeStyle: "short"
      }).format(date);
    }

    async function api(path, options = {}) {
      const response = await fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token()}`,
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        if (response.status === 401) {
          showLogin();
        }
        throw new Error(data.message || "Request failed.");
      }

      return data;
    }

    function showLogin() {
      adminApp.style.display = "none";
      loginScreen.style.display = "grid";
    }

    function showApp() {
      loginScreen.style.display = "none";
      adminApp.style.display = "block";
    }

    function updateMetrics() {
      document.getElementById("total-count").textContent = leads.length;
      document.getElementById("new-count").textContent = leads.filter((lead) => lead.status === "new").length;
      document.getElementById("contacted-count").textContent = leads.filter((lead) => lead.status === "contacted").length;
      document.getElementById("converted-count").textContent = leads.filter((lead) => lead.status === "converted").length;
    }

    function renderRows() {
      updateMetrics();
      emptyState.hidden = leads.length > 0;

      leadRows.innerHTML = leads
        .map((lead) => `
          <tr>
            <td>${escapeHtml(formatDate(lead.createdAt || lead.submittedAt))}</td>
            <td>${escapeHtml(labels[lead.formType] || lead.formType || "")}</td>
            <td>${escapeHtml(lead.name)}</td>
            <td>${escapeHtml(lead.email)}</td>
            <td>${escapeHtml(lead.phone)}</td>
            <td>${escapeHtml(lead.companyName)}</td>
            <td>${escapeHtml(lead.sourcePage)}</td>
            <td><span class="status status--${escapeHtml(lead.status || "new")}">${escapeHtml(lead.status || "new")}</span></td>
            <td>
              <div class="row-actions">
                <button class="small-button" type="button" data-view="${escapeHtml(lead.id)}">View</button>
                <select data-status="${escapeHtml(lead.id)}" aria-label="Update status">
                  ${["new", "contacted", "qualified", "converted", "rejected"].map((status) => `
                    <option value="${status}" ${status === lead.status ? "selected" : ""}>${status}</option>
                  `).join("")}
                </select>
              </div>
            </td>
          </tr>
        `)
        .join("");
    }

    function buildQuery() {
      const params = new URLSearchParams();
      new FormData(filtersForm).forEach((value, key) => {
        if (String(value).trim()) {
          params.set(key, String(value).trim());
        }
      });
      return params.toString();
    }

    async function loadLeads() {
      leadRows.innerHTML = '<tr><td colspan="9">Loading leads...</td></tr>';
      emptyState.hidden = true;
      try {
        const query = buildQuery();
        const data = await api(`/api/admin/leads${query ? `?${query}` : ""}`);
        leads = data.leads || [];
        renderRows();
      } catch (error) {
        leadRows.innerHTML = `<tr><td colspan="9">${escapeHtml(error.message || "Unable to load leads.")}</td></tr>`;
      }
    }

    function renderDetails(lead) {
      detailSubtitle.textContent = `${labels[lead.formType] || lead.formType || "Lead"} · ${formatDate(lead.createdAt || lead.submittedAt)}`;
      const groups = [
        ["Lead", ["formType", "status", "name", "email", "phone", "companyName", "website", "businessType", "partnerType", "selectedPlan", "customerVolume", "preferredDemoTime", "consent", "message", "clientNetwork"]],
        ["Lead Source", ["utmSource", "utmMedium", "utmCampaign", "utmTerm", "utmContent", "gclid", "fbclid", "msclkid", "landingPage", "firstPageUrl", "referrer", "capturedAt"]],
        ["Page Details", ["sourcePage", "pageUrl", "userAgent", "submittedAt", "createdAt", "updatedAt", "ipAddress"]]
      ];

      const fieldLabels = {
        formType: "Lead Type",
        companyName: "Company",
        selectedPlan: "Selected Plan",
        businessType: "Business Type",
        partnerType: "Partner Type",
        customerVolume: "Customer Volume",
        clientNetwork: "Client Network",
        preferredDemoTime: "Preferred Demo Time",
        utmSource: "UTM Source",
        utmMedium: "UTM Medium",
        utmCampaign: "UTM Campaign",
        utmTerm: "UTM Term",
        utmContent: "UTM Content",
        firstPageUrl: "First Page URL",
        landingPage: "Landing Page",
        capturedAt: "Captured At",
        sourcePage: "Source Page",
        pageUrl: "Page URL",
        userAgent: "User Agent",
        submittedAt: "Submitted At",
        createdAt: "Created At",
        updatedAt: "Updated At",
        ipAddress: "IP Address"
      };

      detailBody.innerHTML = groups
        .map(([title, fields]) => {
          const rows = fields
            .filter((field) => lead[field] !== undefined && lead[field] !== null && String(lead[field]).trim() !== "")
            .map((field) => `
              <dt>${escapeHtml(fieldLabels[field] || field)}</dt>
              <dd>${escapeHtml(["submittedAt", "createdAt", "updatedAt"].includes(field) ? formatDate(lead[field]) : lead[field])}</dd>
            `)
            .join("");

          if (!rows) return "";

          return `
            <section class="detail-section">
              <h2>${escapeHtml(title)}</h2>
              <dl class="details">${rows}</dl>
            </section>
          `;
        })
        .join("");
    }

    async function openDetails(id) {
      const existing = leads.find((lead) => lead.id === id);
      modal.classList.add("is-open");
      detailBody.innerHTML = "<p>Loading details...</p>";
      try {
        const data = await api(`/api/admin/leads/${encodeURIComponent(id)}`);
        renderDetails(data.lead || existing || {});
      } catch (error) {
        detailBody.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
      }
    }

    async function updateStatus(id, status) {
      await api(`/api/admin/leads/${encodeURIComponent(id)}/status`, {
        method: "PATCH",
        body: JSON.stringify({ status })
      });
      await loadLeads();
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.textContent = "";
      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      try {
        const values = Object.fromEntries(new FormData(loginForm).entries());
        const response = await fetch(`${API_BASE_URL}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(values)
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.token) {
          throw new Error(data.message || "Invalid login.");
        }
        setToken(data.token);
        showApp();
        await loadLeads();
      } catch (error) {
        loginError.textContent = error.message || "Invalid login.";
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });

    logoutButton.addEventListener("click", () => {
      setToken("");
      leads = [];
      showLogin();
    });

    filtersForm.addEventListener("submit", (event) => {
      event.preventDefault();
      void loadLeads();
    });

    leadRows.addEventListener("click", (event) => {
      const button = event.target.closest("[data-view]");
      if (button) {
        void openDetails(button.dataset.view);
      }
    });

    leadRows.addEventListener("change", (event) => {
      const select = event.target.closest("[data-status]");
      if (select) {
        void updateStatus(select.dataset.status, select.value);
      }
    });

    closeModal.addEventListener("click", () => modal.classList.remove("is-open"));
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        modal.classList.remove("is-open");
      }
    });

    if (token()) {
      showApp();
      void loadLeads();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
