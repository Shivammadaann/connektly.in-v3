    <style>
      :root {

        --green-soft: #eaf2ff;
        --blue: #16b7ff;

      *,

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--text);
        font-family: "Manrope", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      img,

      a {

      [data-site-header] {
        display: block;
        min-height: calc(var(--site-header-shell-height) + 0.25rem);
      }

      .site-header {
        position: fixed;
        top: var(--header-float-offset);
        left: 50%;
        z-index: 35;
        width: min(calc(100% - clamp(1rem, 3vw, 3rem)), min(var(--max-width), 1480px));

        gap: clamp(0.55rem, 1.4vw, 1.1rem);

        border-radius: 999px;
        background: rgba(10, 18, 32, 0.84);
        color: #ffffff;
        box-shadow:

          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transform: translateX(-50%);

          top 280ms ease,
          width 280ms ease,
          padding 280ms ease,
          background 280ms ease,
          border-color 280ms ease,
          box-shadow 280ms ease,
          transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
        animation: headerDropDesktop 640ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .site-header.is-scrolled {
        top: 0.45rem;

        padding-block: 0.42rem;
        background: rgba(8, 13, 24, 0.92);
        border-color: rgba(255, 255, 255, 0.16);
        box-shadow:
          0 16px 44px rgba(8, 13, 24, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .site-header.is-hidden:not(.is-open) {
        transform: translateX(-50%) translateY(calc(-100% - 1.2rem));
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.62rem;
        min-width: 0;
        justify-self: start;
        transition: transform 220ms ease;
      }

      .brand:hover {
        transform: translateY(-1px);
      }

      .brand__mark {
        width: 2.35rem;
        height: 2.35rem;

        place-items: center;
        border-radius: 0.82rem;
        background: #ffffff;

      .brand__mark img {
        width: 100%;
        height: 100%;

      .brand__text strong {
        color: #ffffff;
        font-family: "Sora", "Manrope", sans-serif;

        letter-spacing: 0;
      }

      .site-nav {
        display: flex;
        align-items: center;
        justify-self: center;
        gap: 0.2rem;
        padding: 0.18rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
      }

      .site-nav > a:not(.button),
      .nav-dropdown__toggle {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        min-height: 2.25rem;
        padding: 0.55rem 0.72rem;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.78);
        font-size: 0.88rem;
        font-weight: 700;
        line-height: 1;
        transition: color 200ms ease, background 200ms ease, transform 200ms ease;
      }

      .site-nav > a:not(.button)::before,
      .nav-dropdown__toggle::before {
        content: "";
        position: absolute;
        inset: 0.22rem;
        z-index: -1;
        border-radius: inherit;
        background: rgba(47, 134, 255, 0.13);
        border: 1px solid rgba(47, 134, 255, 0.1);
        opacity: 0;
        transform: scale(0.82);
        transition: opacity 220ms ease, transform 220ms ease;
      }

      .site-nav > a:not(.button):hover,
      .site-nav > a:not(.button).is-active,
      .nav-dropdown__toggle:hover,
      .nav-dropdown[open] > .nav-dropdown__toggle,
      .nav-dropdown--current > .nav-dropdown__toggle {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.06);
        transform: translateY(-1px);
      }

      .site-nav > a:not(.button).is-active,
      .nav-dropdown--current > .nav-dropdown__toggle {
        color: #2f86ff;
      }

      .site-nav > a:not(.button):hover::before,
      .site-nav > a:not(.button).is-active::before,
      .nav-dropdown__toggle:hover::before,
      .nav-dropdown[open] > .nav-dropdown__toggle::before,
      .nav-dropdown--current > .nav-dropdown__toggle::before {
        opacity: 1;
        transform: scale(1);
      }

      .nav-dropdown {
        position: relative;
      }

      .nav-dropdown__toggle {
        gap: 0.45rem;
        cursor: pointer;
        font-family: inherit;
      }

      .nav-dropdown__toggle::after {
        content: "";
        width: 0.38rem;
        height: 0.38rem;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg) translateY(-1px);
        transform-origin: center;
        transition: transform 180ms ease;
      }

      .nav-dropdown:hover > .nav-dropdown__toggle::after,
      .nav-dropdown[open] > .nav-dropdown__toggle::after {
        transform: rotate(225deg) translate(-1px, -1px);
      }

      .nav-dropdown__menu {
        position: absolute;
        top: calc(100% + 0.72rem);
        left: 50%;
        z-index: 40;
        display: block;
        min-width: 260px;
        max-width: 300px;
        padding: 0.55rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 1.1rem;
        background: rgba(8, 15, 26, 0.94);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        opacity: 0;
        visibility: hidden;
        transform: translateX(-50%) translateY(0.8rem) scale(0.97);
        transition:
          opacity 220ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 220ms cubic-bezier(0.16, 1, 0.3, 1),
          visibility 220ms;
      }

      .nav-dropdown__menu::before {
        content: "";
        position: absolute;
        top: -1rem;
        left: 0;
        right: 0;
        height: 1rem;
      }

      .nav-dropdown:hover .nav-dropdown__menu,
      .nav-dropdown[open] .nav-dropdown__menu {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0) scale(1);
      }

      .nav-dropdown__menu a {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
        padding: 0.72rem 0.82rem;
        border-radius: 0.78rem;
        transition: background 180ms ease, transform 180ms ease;
      }

      .nav-dropdown__menu a:hover,
      .nav-dropdown__menu a.is-active {
        background: rgba(255, 255, 255, 0.075);
        transform: translateX(2px);
      }

      .dropdown-item-label {
        color: #e7eef7;
        font-size: 0.9rem;
        font-weight: 800;
      }

      .dropdown-item-desc {
        color: #94a3b8;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .header-actions {
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 0.62rem;
      }

      .header-actions .nav-login,
      .mobile-actions .nav-login {
        padding: 0.58rem 0.62rem;
        border-radius: 999px;
        color: #ffffff;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .header-actions .nav-login:hover,
      .mobile-actions .nav-login:hover {
        background: rgba(255, 255, 255, 0.07);
        color: #2f86ff;
      }

      .mobile-actions,
      .nav-toggle {
        display: none;
      }

      .nav-toggle {
        width: 2.55rem;
        height: 2.55rem;
        place-items: center;
        gap: 0.28rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      .nav-toggle span {
        width: 1.05rem;
        height: 2px;
        border-radius: 999px;
        background: #ffffff;
        transition: transform 220ms ease;
      }

      @media (max-width: 1080px) {
        .site-nav {
          gap: 0.05rem;
        }

        .site-nav > a:not(.button),
        .nav-dropdown__toggle {
          padding-inline: 0.58rem;
          font-size: 0.84rem;
        }
      }

      @media (max-width: 820px) {
        .site-header {
          grid-template-columns: auto auto;
          justify-content: space-between;
          padding: 0.5rem 0.6rem 0.5rem 0.6rem;
        }

        .site-nav {
          position: absolute;
          top: calc(100% + 0.5rem);
          left: 0;
          right: 0;
          display: grid;
          align-content: start;
          gap: 0.5rem;
          padding: 1rem;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 1.25rem;
          background: rgba(8, 13, 24, 0.96);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
          opacity: 0;
          visibility: hidden;
          transform: translateY(-8px);
          transition: opacity 280ms ease, visibility 280ms, transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .site-header.is-open .site-nav {
          opacity: 1;
          visibility: visible;
          transform: translateY(0);
        }

        .site-nav > a:not(.button),
        .nav-dropdown__toggle {
          justify-content: space-between;
          padding: 0.85rem 1rem;
          border-radius: 0.85rem;
          font-size: 1rem;
        }

        .nav-dropdown__menu {
          position: static;
          max-width: none;
          min-width: 0;
          padding: 0.5rem 0 0.5rem 0.8rem;
          border: 0;
          background: transparent;
          box-shadow: none;
          backdrop-filter: none;
          opacity: 1;
          visibility: visible;
          transform: none;
          display: none;
        }

        .nav-dropdown[open] .nav-dropdown__menu {
          display: block;
        }

        .nav-dropdown__menu::before {
          display: none;
        }

        .header-actions {
          display: none;
        }

        .mobile-actions {
          display: grid;
          gap: 0.5rem;
          padding-top: 1rem;
          margin-top: 0.5rem;
          border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-toggle {
          display: grid;
        }

        .site-header.is-open .nav-toggle span:first-child {
          transform: translateY(3.5px) rotate(45deg);
        }

        .site-header.is-open .nav-toggle span:last-child {
          transform: translateY(-3.5px) rotate(-45deg);
        }
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--site-header-shell-height) + 0.2rem) 1.5rem 4rem;

      .thank-you-panel {

        max-width: 580px;

        -webkit-backdrop-filter: blur(20px);

        isolation: isolate;

      .thank-you-panel::before {
        content: "";
        position: absolute;
        inset: -1px;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(135deg, rgba(47, 134, 255, 0.3), rgba(22, 183, 255, 0.2));

        height: 5rem;

        color: #ffffff;
        box-shadow: 0 16px 36px rgba(17, 201, 100, 0.3);
        animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .icon-wrapper svg {
        width: 2.5rem;
        height: 2.5rem;
      }

      .thank-you-panel h1 {
        margin: 0 0 1rem;

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.5) rotate(-15deg);
        }
        to {

          transform: scale(1) rotate(0);
        }
      }
